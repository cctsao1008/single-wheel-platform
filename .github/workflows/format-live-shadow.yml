name: Format live shadow branch

on:
  push:
    branches: [live-shadow-control-profile]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live-shadow-control-profile
      - name: Install Rust toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name Cheng
          git config user.email chiacheng.tsao@gmail.com
          git add -A
          git commit -m "Apply rustfmt to live shadow profiler"
          git push origin HEAD:live-shadow-control-profile
