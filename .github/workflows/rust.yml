name: Rust firmware

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Workspace check
        run: cargo check --workspace --target thumbv7m-none-eabi
      - name: Clippy
        run: cargo clippy --workspace --target thumbv7m-none-eabi -- -D warnings
      - name: Sensor transfer and calibration tests
        run: |
          cargo test -p swp-mpu6050 --target x86_64-unknown-linux-gnu
          cargo test -p swp-sensor-calibration --target x86_64-unknown-linux-gnu
      - name: Observation record tests
        run: cargo test -p swp-observation-record --target x86_64-unknown-linux-gnu
      - name: Host recording decoder tests
        run: python3 -m unittest discover -s tools/recording -p 'test_*.py'
      - name: Link release firmware
        run: cargo build -p swp-stm32f103 --release --target thumbv7m-none-eabi
