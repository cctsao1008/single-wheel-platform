name: Rust firmware

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Workspace check
        run: cargo check --workspace --target thumbv7m-none-eabi
      - name: Clippy
        run: cargo clippy --workspace --target thumbv7m-none-eabi -- -D warnings
