name: Rust firmware

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Workspace check
        run: cargo check --workspace --target thumbv7m-none-eabi
      - name: Clippy
        run: cargo clippy --workspace --target thumbv7m-none-eabi -- -D warnings
      - name: DSP kernel tests
        run: cargo test -p swp-dsp-kernel --target x86_64-unknown-linux-gnu
      - name: Plant model tests
        run: cargo test -p swp-plant-model --target x86_64-unknown-linux-gnu
      - name: Measurement model tests
        run: cargo test -p swp-measurement-model --target x86_64-unknown-linux-gnu
      - name: State estimator tests
        run: cargo test -p swp-state-estimator --target x86_64-unknown-linux-gnu
      - name: Estimator input tests
        run: cargo test -p swp-estimator-input --target x86_64-unknown-linux-gnu
      - name: State feedback tests
        run: cargo test -p swp-state-feedback --target x86_64-unknown-linux-gnu
      - name: Control runtime tests
        run: cargo test -p swp-control-runtime --target x86_64-unknown-linux-gnu
      - name: Actuator model tests
        run: cargo test -p swp-actuator-model --target x86_64-unknown-linux-gnu
      - name: Reference assembly mapping tests
        run: cargo test -p swp-reference-assembly --target x86_64-unknown-linux-gnu
      - name: Sensor transfer and calibration tests
        run: |
          cargo test -p swp-mpu6050 --target x86_64-unknown-linux-gnu
          cargo test -p swp-sensor-calibration --target x86_64-unknown-linux-gnu
      - name: Frame transform tests
        run: cargo test -p swp-frame-transform --target x86_64-unknown-linux-gnu
      - name: Runtime authority tests
        run: cargo test -p swp-runtime-state --target x86_64-unknown-linux-gnu
      - name: Observation record tests
        run: cargo test -p swp-observation-record --target x86_64-unknown-linux-gnu
      - name: Host recording decoder tests
        run: python3 -m unittest discover -s tools/recording -p 'test_*.py'
      - name: Host wireless observer syntax
        run: python3 -m py_compile tools/wireless/observe.py
      - name: Install control synthesis dependencies
        run: python3 -m pip install -r tools/control/requirements.txt
      - name: Actuator identification tests
        run: python3 -m unittest discover -s tools/actuator -p 'test_*.py'
      - name: Control synthesis tests
        run: python3 -m unittest discover -s tools/control -p 'test_*.py'
      - name: Link release firmware
        run: cargo build -p swp-stm32f103 --release --target thumbv7m-none-eabi
      - name: Link control footprint probe
        run: cargo build -p swp-control-footprint-stm32f103 --release --target thumbv7m-none-eabi
