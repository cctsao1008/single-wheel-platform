name: Final EKF clippy cleanup

on:
  push:
    branches: [production-ekf-control]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-ekf-control
      - name: Install Rust toolchain
        run: rustup show
      - name: Apply fixes
        run: |
          cargo clippy -p swp-ekf --target thumbv7m-none-eabi --fix --allow-dirty --allow-staged -- -D warnings
          cargo fmt --all
          rm .github/workflows/fix-ekf-clippy-final.yml
      - name: Commit cleanup
        run: |
          git config user.name Cheng
          git config user.email chiacheng.tsao@gmail.com
          git add -A
          git commit -m "Clean up EKF loops for clippy"
          git push origin HEAD:production-ekf-control
