name: Finalize PR10 formatting

on:
  push:
    branches: [production-ekf-control]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-ekf-control
      - name: Install Rust toolchain
        run: rustup show
      - name: Format workspace
        run: |
          cargo fmt --all
          rm .github/workflows/format-final-pr10.yml
      - name: Commit formatting
        run: |
          git config user.name Cheng
          git config user.email chiacheng.tsao@gmail.com
          git add -A
          git commit -m "Finalize PR10 formatting"
          git push origin HEAD:production-ekf-control
