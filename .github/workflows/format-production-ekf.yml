name: Format production EKF branch

on:
  push:
    branches: [production-ekf-control]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-ekf-control
      - name: Install Rust toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name Cheng
          git config user.email chiacheng.tsao@gmail.com
          git add -A
          git commit -m "Apply rustfmt to EKF implementation"
          git push origin HEAD:production-ekf-control
