name: Fix control runtime estimator test

on:
  push:
    branches: [production-ekf-control]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-ekf-control
      - name: Update renamed estimator field in unit test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/control-runtime/src/lib.rs')
          s = p.read_text()
          old = 'runtime.observer.estimate().validity'
          new = 'runtime.estimator.estimate().validity'
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/fix-control-runtime-test.yml
      - name: Commit fix
        run: |
          git config user.name Cheng
          git config user.email chiacheng.tsao@gmail.com
          git add -A
          git commit -m "Fix estimator-agnostic runtime reset test"
          git push origin HEAD:production-ekf-control
