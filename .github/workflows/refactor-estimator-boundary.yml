name: Refactor estimator boundary

on:
  push:
    branches: [production-ekf-control]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-ekf-control
      - name: Install Rust toolchain
        run: rustup show
      - name: Refactor estimator interface
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # state-estimator: define the architecture-facing estimator contract.
          p = Path('crates/state-estimator/src/lib.rs')
          s = p.read_text()
          anchor = '''pub enum EstimateError {\n    TimingInvalid,\n    MissingRequiredMeasurement(usize),\n    NonFiniteMeasurement(usize),\n    NonFiniteInput,\n    NumericalFault,\n}\n'''
          trait = anchor + '''\n/// Architecture-facing contract for balance-state estimation.\n///\n/// Control-runtime depends on this semantic boundary rather than on a specific\n/// observer implementation. Estimator implementations own their internal\n/// covariance/gain state while exposing the same physical causality.\npub trait BalanceStateEstimator {\n    fn reset(&mut self, state: ReducedBalanceState) -> bool;\n\n    fn estimate(&self) -> EstimatedBalanceState;\n\n    fn step(\n        &mut self,\n        previous_input: ReferencePlantInput,\n        measurement_input: ReferencePlantInput,\n        measurement: EstimatorMeasurement,\n    ) -> Result<EstimatedBalanceState, EstimateError>;\n}\n'''
          if 'pub trait BalanceStateEstimator' not in s:
              assert anchor in s
              s = s.replace(anchor, trait, 1)

          impl_anchor = '''fn state_from_vector(value: [f32; REDUCED_BALANCE_STATE_COUNT]) -> ReducedBalanceState {'''
          impl_text = '''impl BalanceStateEstimator for LinearObserver {\n    fn reset(&mut self, state: ReducedBalanceState) -> bool {\n        LinearObserver::reset(self, state)\n    }\n\n    fn estimate(&self) -> EstimatedBalanceState {\n        LinearObserver::estimate(self)\n    }\n\n    fn step(\n        &mut self,\n        previous_input: ReferencePlantInput,\n        measurement_input: ReferencePlantInput,\n        measurement: EstimatorMeasurement,\n    ) -> Result<EstimatedBalanceState, EstimateError> {\n        LinearObserver::step(self, previous_input, measurement_input, measurement)\n    }\n}\n\n'''
          if 'impl BalanceStateEstimator for LinearObserver' not in s:
              assert impl_anchor in s
              s = s.replace(impl_anchor, impl_text + impl_anchor, 1)
          p.write_text(s)

          # EKF: implement the same estimator contract while preserving a reset covariance.
          p = Path('crates/ekf/src/lib.rs')
          s = p.read_text()
          s = s.replace(
              'EstimateError, EstimatedBalanceState, EstimatorMeasurement, MeasurementMask,',
              'BalanceStateEstimator, EstimateError, EstimatedBalanceState, EstimatorMeasurement, MeasurementMask,',
              1,
          )
          field_anchor = '''    covariance: [[f32; REDUCED_BALANCE_STATE_COUNT]; REDUCED_BALANCE_STATE_COUNT],\n    validity: StateValidity,\n'''
          if 'reset_variance:' not in s:
              assert field_anchor in s
              s = s.replace(
                  field_anchor,
                  '''    covariance: [[f32; REDUCED_BALANCE_STATE_COUNT]; REDUCED_BALANCE_STATE_COUNT],\n    reset_variance: [f32; REDUCED_BALANCE_STATE_COUNT],\n    validity: StateValidity,\n''',
                  1,
              )
          ctor_anchor = '''            state,\n            covariance,\n            validity: StateValidity::Invalid,\n'''
          if 'reset_variance: initial_variance' not in s:
              assert ctor_anchor in s
              s = s.replace(
                  ctor_anchor,
                  '''            state,\n            covariance,\n            reset_variance: initial_variance,\n            validity: StateValidity::Invalid,\n''',
                  1,
              )
          reset_anchor = '''        self.state = vector;\n        self.covariance = [[0.0; REDUCED_BALANCE_STATE_COUNT]; REDUCED_BALANCE_STATE_COUNT];\n'''
          if 'self.reset_variance = variance;' not in s:
              assert reset_anchor in s
              s = s.replace(
                  reset_anchor,
                  '''        self.state = vector;\n        self.reset_variance = variance;\n        self.covariance = [[0.0; REDUCED_BALANCE_STATE_COUNT]; REDUCED_BALANCE_STATE_COUNT];\n''',
                  1,
              )
          ekf_impl_anchor = '''fn symmetrize(\n'''
          ekf_impl = '''impl BalanceStateEstimator for ExtendedKalmanFilter {\n    fn reset(&mut self, state: ReducedBalanceState) -> bool {\n        let variance = self.reset_variance;\n        ExtendedKalmanFilter::reset(self, state, variance)\n    }\n\n    fn estimate(&self) -> EstimatedBalanceState {\n        ExtendedKalmanFilter::estimate(self)\n    }\n\n    fn step(\n        &mut self,\n        previous_input: ReferencePlantInput,\n        measurement_input: ReferencePlantInput,\n        measurement: EstimatorMeasurement,\n    ) -> Result<EstimatedBalanceState, EstimateError> {\n        ExtendedKalmanFilter::step(self, previous_input, measurement_input, measurement)\n            .map(|result| result.estimate)\n    }\n}\n\n'''
          if 'impl BalanceStateEstimator for ExtendedKalmanFilter' not in s:
              assert ekf_impl_anchor in s
              s = s.replace(ekf_impl_anchor, ekf_impl + ekf_impl_anchor, 1)
          p.write_text(s)

          # control-runtime: depend on estimator semantics, not LinearObserver ownership.
          p = Path('crates/control-runtime/src/lib.rs')
          s = p.read_text()
          s = s.replace(
              'EstimateError, EstimatedBalanceState, EstimatorMeasurement, LinearObserver,',
              'BalanceStateEstimator, EstimateError, EstimatedBalanceState, EstimatorMeasurement, LinearObserver,',
              1,
          )
          s = s.replace(
              'pub struct ControlRuntime {\n    observer: LinearObserver,',
              'pub struct ControlRuntime<E = LinearObserver>\nwhere\n    E: BalanceStateEstimator,\n{\n    estimator: E,',
              1,
          )
          s = s.replace(
              'impl ControlRuntime {\n    pub const fn new(\n        observer: LinearObserver,',
              'impl<E> ControlRuntime<E>\nwhere\n    E: BalanceStateEstimator,\n{\n    pub fn new(\n        estimator: E,',
              1,
          )
          s = s.replace('            observer,\n            controller,', '            estimator,\n            controller,', 1)
          s = s.replace('self.observer.reset(initial_state)', 'self.estimator.reset(initial_state)')
          s = s.replace('.observer\n            .step(', '.estimator\n            .step(', 1)
          s = s.replace('between estimator, controller, inverse actuator', 'between StateEstimator, controller, inverse actuator')
          s = s.replace('The observer is reset to the supplied physical state', 'The selected estimator is reset to the supplied physical state')
          s = s.replace('The observer uses the previously authorized physical effort', 'The selected estimator uses the previously authorized physical effort')
          p.write_text(s)
          PY

          cargo fmt --all
          cargo clippy -p swp-state-estimator -p swp-ekf -p swp-control-runtime --target thumbv7m-none-eabi --fix --allow-dirty --allow-staged -- -D warnings
          cargo fmt --all
          rm .github/workflows/refactor-estimator-boundary.yml
      - name: Commit estimator refactor
        run: |
          git config user.name Cheng
          git config user.email chiacheng.tsao@gmail.com
          git add -A
          git commit -m "Make control runtime estimator-agnostic"
          git push origin HEAD:production-ekf-control
