[workspace]
resolver = "2"
members = [
    "plant/robot-domain",
    "plant/plant-model",
    "plant/measurement-model",
    "plant/plant-observation",
    "plant/actuator-model",
    "control/state-feedback",
    "control/velocity-loop",
    "supervisor/state-estimator",
    "supervisor/ekf",
    "supervisor/runtime-state",
    "supervisor/runtime-supervisor",
    "supervisor/control-runtime",
    "infrastructure/dsp-kernel",
    "infrastructure/observation-record",
    "infrastructure/runtime-observation-record",
    "infrastructure/control-profile-record",
    "firmware/interfaces/actuation",
    "firmware/sensors/mpu6050",
    "firmware/communications/telemetry",
    "firmware/communications/ecb02",
    "firmware/ui/status",
    "firmware/ui/oled",
    "firmware/buses/software-i2c",
    "firmware/adapters/sensor-calibration",
    "firmware/adapters/frame-transform",
    "firmware/adapters/estimator-input",
    "firmware/boards/one-v2",
    "firmware/actuators/one-v2-pwm-dir",
    "firmware/assemblies/one-v2-reference",
    "firmware/targets/stm32f103/observation",
    "firmware/targets/stm32f103/one-v2-pwm-dir",
    "firmware/targets/stm32f103/control-footprint",
    "firmware/targets/stm32f103/live-shadow",
    "firmware/targets/stm32f103/control-shadow",
    "firmware/targets/stm32f103/runtime-shadow",
    "firmware/targets/stm32f103/io-shadow",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
embedded-hal = "1.0.0"
heapless = "0.8.0"
cortex-m = { version = "0.7.9", features = ["critical-section-single-core"] }
panic-halt = "1.0.0"
rtic = { version = "2.3.1", features = ["thumbv7-backend"] }
stm32f1xx-hal = { version = "0.11.0", features = ["rtic", "stm32f103", "medium"] }

[profile.dev]
opt-level = "s"
panic = "abort"

[profile.release]
codegen-units = 1
debug = 2
lto = true
opt-level = "s"
panic = "abort"
