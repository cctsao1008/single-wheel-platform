edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
swp-actuation-interface = { path = "../../firmware/interfaces/actuation" }
